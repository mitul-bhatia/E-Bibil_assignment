<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title description">
  <title id="title">Source: from documents to a cited answer</title>
  <desc id="description">Prepare 142 normalized 768-dimensional Gemini embeddings once from three Automattic Markdown documents. For each question, embed the query, find the top four passages by cosine similarity, ask Gemini for an evidence-based answer, and validate citation IDs.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#b8d8a4" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#ebefe9}
      .label{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#b8d8a4}
      .heading{font-size:20px;font-weight:600}
      .detail{font-size:15px;fill:#a4b1a6}
      .box{fill:#1e2520;stroke:#47574a;stroke-width:1}
      .line{fill:none;stroke:#b8d8a4;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="740" rx="16" fill="#151916"/>
  <text x="40" y="46" class="label">SOURCE / HOW IT WORKS</text>
  <text x="40" y="100" font-size="34" font-weight="500">A question becomes an answer you can trace.</text>
  <text x="40" y="133" class="detail">One Next.js app · Gemini · A saved vector index</text>
  <path d="M40 156H1080" stroke="#343d36"/>

  <text x="40" y="190" class="label">01 / PREPARE ONCE</text>
  <rect x="40" y="210" width="230" height="120" rx="10" class="box"/>
  <text x="58" y="246" class="heading">3 source documents</text>
  <text x="58" y="275" class="detail">Terms · Privacy · Cookies</text>
  <text x="58" y="304" class="detail">Original Automattic Markdown</text>
  <path d="M276 270H300" class="line"/>
  <rect x="310" y="210" width="230" height="120" rx="10" class="box"/>
  <text x="328" y="246" class="heading">Split by section</text>
  <text x="328" y="275" class="detail">Up to 1,800 characters</text>
  <text x="328" y="304" class="detail">Up to 200 characters overlap</text>
  <path d="M546 270H570" class="line"/>
  <rect x="580" y="210" width="230" height="120" rx="10" class="box"/>
  <text x="598" y="246" class="heading">Gemini Embedding 2</text>
  <text x="598" y="275" class="detail">142 vectors · 768 dimensions</text>
  <text x="598" y="304" class="detail">Normalize each vector</text>
  <path d="M816 270H840" class="line"/>
  <rect x="850" y="210" width="230" height="120" rx="10" class="box"/>
  <text x="868" y="246" class="heading">Save the vector store</text>
  <text x="868" y="275" class="detail">data/index.json</text>
  <text x="868" y="304" class="detail">Vectors + text + source details</text>

  <path d="M965 331V374H695V420" class="line" stroke-dasharray="5 5"/>
  <text x="756" y="365" class="detail">Reuse saved embeddings</text>
  <text x="40" y="402" class="label">02 / FOR EACH QUESTION</text>
  <rect x="40" y="430" width="230" height="120" rx="10" class="box"/>
  <text x="58" y="466" class="heading">Ask in the chat</text>
  <text x="58" y="495" class="detail">React interface</text>
  <text x="58" y="524" class="detail">POST /api/ask</text>
  <path d="M276 490H300" class="line"/>
  <rect x="310" y="430" width="230" height="120" rx="10" class="box"/>
  <text x="328" y="466" class="heading">Embed the question</text>
  <text x="328" y="495" class="detail">Same embedding model</text>
  <text x="328" y="524" class="detail">One Google API request</text>
  <path d="M546 490H570" class="line"/>
  <rect x="580" y="430" width="230" height="120" rx="10" class="box"/>
  <text x="598" y="466" class="heading">Cosine similarity</text>
  <text x="598" y="495" class="detail">Scan the 142 saved vectors</text>
  <text x="598" y="524" class="detail">Retrieve the top 4 passages</text>
  <path d="M816 490H840" class="line"/>
  <rect x="850" y="430" width="230" height="120" rx="10" class="box"/>
  <text x="868" y="466" class="heading">Ground the answer</text>
  <text x="868" y="495" class="detail">Gemini Flash-Lite</text>
  <text x="868" y="524" class="detail">Use only retrieved evidence</text>
  <path d="M965 551V594" class="line"/>

  <rect x="40" y="606" width="1040" height="98" rx="10" fill="#101411" stroke="#47574a"/>
  <text x="60" y="639" class="heading">Check citation IDs. Show the evidence.</text>
  <text x="60" y="670" class="detail">Document + section + exact excerpt + original source link</text>
  <path d="M697 626V684" stroke="#343d36"/>
  <text x="720" y="639" class="heading">Missing evidence?</text>
  <text x="720" y="670" class="detail">“I don't know” with no citations.</text>
</svg>
